<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbitScope</title>
  </head>
  <body>
    <div id="globe"></div>
    <div class="hud">
      <div class="kicker">OrbitScope</div>
      <h1>Starlink from Freeport</h1>
      <div id="status" class="status">waiting on the api…</div>
    </div>
    <div class="panel">
      <label>
        find one
        <input id="search" type="search" placeholder="starlink-1234 or 25544" />
      </label>
      <div class="filters">
        <button data-filter="ALL" class="active">all</button>
        <button data-filter="STARLINK">starlink</button>
        <button data-filter="GPS">gps</button>
        <button data-filter="ISS">iss</button>
      </div>
      <div class="legend">
        <span><i class="dot starlink"></i> starlink</span>
        <span><i class="dot gps"></i> gps</span>
        <span><i class="dot iss"></i> iss</span>
        <span><i class="dot ground"></i> home</span>
      </div>
      <div id="info" class="info">
        <p>click a dot. times are from freeport (that's home).</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
